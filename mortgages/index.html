  reach this audience as a lender, so this page is the business behind the
  hobby.

  Everything a human has to confirm lives in the block at the top of
  /assets/js/mortgages.js. Nothing on this page needs editing to change it.

  The states sentence and the footer block are approved by Alameda Mortgage
  compliance, and both are built from the COMPLIANCE and REFERRAL blocks in the
  JS. Do not hand-edit either here.

  Both NMLS numbers stay on this page: Trevor's #929381 in the role line, and
  Alameda Mortgage's #271603 in the compliance footer, which also repeats his.
  The destination application carries both, so a page that links into it should
  too. Do not drop either in a copy swap. Grep for 929381 and 271603 before
  committing anything that touches this page.

  The apply button is fully styled and does nothing until MORTGAGE_CTA_ENABLED
  is switched on in /assets/js/mortgages.js.
-->
