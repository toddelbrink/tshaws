<!DOCTYPE html>
<!--
  Guests. Every row is built at runtime by /assets/js/guests.js from the
  "Guest:" lines in the live feed. There is no guest list in this markup on
  purpose: anything typed here would go stale.

  The host is filtered out. Trevor writes "Guest: Trevor Shaw (T Shaws
  Progressive Bluegrass)" on solo episodes so the field is never blank, and
  left alone that would make him the most frequent guest on his own show.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F0E6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="icon" href="/assets/logo/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png">
<title>Guests · T Shaw's Progressive Bluegrass</title>
<meta name="description" content="Every guest who has been on T Shaw's Progressive Bluegrass, with links straight to their episodes.">
</head>
<body>
<a class="skip" href="#page">Skip to content</a>
<nav class="sitenav" aria-label="Main"><div class="inner">
  <a href="/">Home</a>
  <span class="navgroup" data-menu="seasons">
    <a href="/episodes/">Podcast</a>
    <button type="button" class="navcaret" aria-expanded="false" hidden>
      <span class="sr-only">Seasons</span>
      <svg viewBox="0 0 10 6" aria-hidden="true" focusable="false"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <ul class="navmenu" hidden></ul>
  </span>
  <span class="navgroup" data-menu="videos">
    <a href="/videos/">Videos</a>
    <button type="button" class="navcaret" aria-expanded="false" hidden>
      <span class="sr-only">Video sections</span>
      <svg viewBox="0 0 10 6" aria-hidden="true" focusable="false"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <ul class="navmenu" hidden></ul>
  </span>
  <a href="/mortgages/">Mortgages</a>
  <a href="/about/">About</a>
</div></nav>

<main id="page">
<!-- id="guestspage", not "guests". /about/ keeps id="guests" for the anchor
       that is already in the wild, and a shared id had guests.js trying to
       render its table into the About page's signpost section. -->
<div class="wrap narrow" id="guestspage">

  <p class="label">The Show</p>
  <h1>Guests</h1>
  <!-- Just the sentence the table's own <caption> does not already say. The
       caption carries "newest first" and what the numbers do, and it ships with
       the table so a screen reader hears it in the right place. -->
  <p class="meta" style="margin-top:8px">Everyone who has come on the show.</p>

  <div id="guestlist"><p class="status">Loading guests...</p></div>

  <footer class="foot">
    <div class="dotrule" style="margin-bottom:22px"></div>
    <p>&copy; <span class="yr"></span> Trevor Shaw. All rights reserved.</p>
    <p class="credit">Site by <a href="mailto:todd@elbrink.com">Todd Elbrink</a></p>
  </footer>

</div>
</main>

<script src="/assets/js/player.js"></script>
<script src="/assets/js/stats.js"></script>
<script src="/assets/js/epvideo.js"></script>
<script src="/assets/js/home.js"></script>

<script src="/assets/js/episodes.js"></script>
<script src="/assets/js/videos.js"></script>
<script src="/assets/js/mortgages.js"></script>
<script src="/assets/js/nav.js"></script>
</body>
</html>
